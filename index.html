<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Šmurkyno žemėlapio redaktorius</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <h1>Šmurknyo žemėlapio redaktorius</h1>

  <div class="controls">
    <label>
      Width:
      <input type="number" id="width" value="10" min="1">
    </label>

    <label>
      Height:
      <input type="number" id="height" value="10" min="1">
    </label>

    <button id="generate">Kurti žemėlapį</button>

    <div class="upload-container">
      <button id="upload">Įkelti žemėlapį</button>
      <input type="file" id="file-input" accept=".txt">
    </div>

    <button id="download">Atsisiųsti žemėlapį</button>
  </div>

  <div class="controls">
    <button id="add-row-top">Pridėti eilutę viršuje</button>
    <button id="add-row-bottom">Pridėti eilutę apačioje</button>
    <button id="add-col-left">Pridėti stulpelį kairėje</button>
    <button id="add-col-right">Pridėti stulpelį dešinėje</button>
  </div>

  <div class="char-toolbar">
    <span>Kaladėlės: </span>
    <button class="char-btn selected">Ž</button>
    <button class="char-btn">G</button>
    <button class="char-btn">M</button>
    <button class="char-btn">P</button>
    <button class="char-btn">V</button>
  </div>

  <div id="grid-wrapper">
    <div id="grid"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
