<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Šmurkyno žemėlapio redaktorius</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <h1>Šmurknyo žemėlapio redaktorius</h1>

  <div class="toolbar-1">
    <span class="map-controls">
      <button id="new-map" class="icon-btn" title="Create a new map">
        <span class="material-icons">add</span>
      </button>
      <select id="map-select"></select>
      <input type="text" id="map-name" placeholder="Map name">
      <select id="map-type-select"></select>
      <span class="origin-controls" title="Žemėlapio pradžia pasaulio koordinatėmis. Kairiojo apatinio laukelio pasaulio koordinatė.">
        <label>origin_x: <input type="number" step="1" id="origin-x" value="0"></label>
        <label>origin_y: <input type="number" step="1" id="origin-y" value="0"></label>
      </span>
    </span>

    <span class="controls">
      <label>
        Width:
        <input type="number" id="width" value="10" min="1">
      </label>
      <label>
        Height:
        <input type="number" id="height" value="10" min="1">
      </label>

      <button id="generate" class="icon-btn" title="Kurti žemėlapį">
        <span class="material-icons">add_box</span>
      </button>
      <div class="upload-container">
        <button id="upload" class="icon-btn" title="Įkelti žemėlapį">
          <span class="material-icons">file_upload</span>
        </button>
        <input type="file" id="file-input" accept=".map,.txt">
      </div>
      <button id="download" class="icon-btn" title="Atsisiųsti žemėlapį">
        <span class="material-icons">file_download</span>
      </button>
      <span class="resize-group">
        <span class="resize-label">Pridėti:</span>
        <button id="add-row-top" class="icon-btn" title="Pridėti eilutę viršuje (šiaurėje)">
          <span class="material-icons">arrow_upward</span>
        </button>
        <button id="add-row-bottom" class="icon-btn" title="Pridėti eilutę apačioje (pietuose)">
          <span class="material-icons">arrow_downward</span>
        </button>
        <button id="add-col-left" class="icon-btn" title="Pridėti stulpelį kairėje (vakaruose)">
          <span class="material-icons">arrow_back</span>
        </button>
        <button id="add-col-right" class="icon-btn" title="Pridėti stulpelį dešinėje (rytuose)">
          <span class="material-icons">arrow_forward</span>
        </button>
      </span>

      <span class="resize-group">
        <span class="resize-label">Pašalinti:</span>
        <button id="remove-row-top" class="icon-btn danger" title="Pašalinti eilutę viršuje (šiaurėje)">
          <span class="material-icons">arrow_upward</span>
        </button>
        <button id="remove-row-bottom" class="icon-btn danger" title="Pašalinti eilutę apačioje (pietuose)">
          <span class="material-icons">arrow_downward</span>
        </button>
        <button id="remove-col-left" class="icon-btn danger" title="Pašalinti stulpelį kairėje (vakaruose)">
          <span class="material-icons">arrow_back</span>
        </button>
        <button id="remove-col-right" class="icon-btn danger" title="Pašalinti stulpelį dešinėje (rytuose)">
          <span class="material-icons">arrow_forward</span>
        </button>
      </span>
    </span>
  </div>

  <div class="toolbar-2">
    <span class="char-toolbar">
      <span>Kaladėlės: </span>
      <button class="char-btn selected">Ž</button>
      <button class="char-btn">G</button>
      <button class="char-btn">M</button>
      <button class="char-btn">P</button>
      <button class="char-btn">V</button>
    </span>

    <span class="points-toolbar">
      <span>Points of Interest: </span>
      <button id="tool-select" class="tool-btn selected">Select</button>
      <button id="tool-transfer" class="tool-btn">Transfer</button>
      <button id="tool-living" class="tool-btn">Living</button>
      <label id="living-type-label" class="hidden">
        Gyvenamojo būsto tipas:
        <select id="living-type-select"></select>
      </label>
    </span>
  </div>

  <div id="origin-warning" class="message warning hidden"></div>
  <div id="notice" class="message error hidden"></div>

  <div id="coord-readout" class="coord-readout"></div>

  <div id="grid-wrapper">
    <div id="grid"></div>
  </div>

  <div id="properties-sidebar" class="sidebar hidden">
    <h3>Properties</h3>
    <div id="properties-content">
        <!-- Properties will be dynamically inserted here -->
    </div>
    <button id="save-properties">Save</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
